name: release-packages-fork

# Release build for this fork: pushing a v* tag builds the fork's packages
# for the devices in use (aarch64_generic, aarch64_cortex-a53) on the
# openwrt-24.10 SDK (so artifacts stay .ipk for opkg-based firmware),
# publishes them as a GitHub Release, and deploys the package feed to this
# fork's own Cloudflare Pages site (voorz-nikki.pages.dev), so routers can
# install and update with feed.sh + opkg exactly like upstream.
#
# The same packages are published under both the openwrt-24.10 and the
# openwrt-25.12 feed paths: feed.sh selects the feed directory from the
# firmware's DISTRIB_RELEASE string, and the target firmware (Kwrt) is
# built from 25.12 sources while using opkg with these 24.10-built .ipk
# packages.
#
# Upstream's release-packages.yml is disabled in this fork's Actions
# settings (full matrix and the upstream feed are not applicable here).

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  release:
    name: ${{ matrix.arch }}-${{ matrix.branch }} release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_generic
          - aarch64_cortex-a53
        branch:
          - openwrt-24.10

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: nikki
          PACKAGES: mihomo-alpha mihomo-meta nikki luci-app-nikki
          INDEX: 1
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          NO_REFRESH_CHECK: true

      - name: compress
        run: |
          tar -c -z -f nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz -C bin/packages/${{ matrix.arch }}/nikki .
          mkdir -p public/${{ matrix.branch }}/${{ matrix.arch }} public/openwrt-25.12/${{ matrix.arch }}
          cp -r bin/packages/${{ matrix.arch }}/nikki public/${{ matrix.branch }}/${{ matrix.arch }}
          cp -r bin/packages/${{ matrix.arch }}/nikki public/openwrt-25.12/${{ matrix.arch }}
          tar -c -z -f feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz public

      - if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}
          path: feed_nikki_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

  feed:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
    needs: release
    name: feed
    runs-on: ubuntu-latest

    steps:
      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: feed_nikki_*
          merge-multiple: true

      - name: uncompress
        run: |
          for file in feed_nikki_*.tar.gz; do tar -x -z -f "$file"; done

      - name: prepare
        run: |
          echo "${{ secrets.KEY_BUILD_PUB }}" > public/key-build.pub
          tree --dirsfirst --sort name -P '*.ipk' --prune --noreport -H "" -T "Nikki Fork Feed" --charset utf-8 -o public/index.html public
          sed -i '/<p class="VERSION">/,/<\/p>/d' public/index.html

      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy public --project-name=voorz-nikki
